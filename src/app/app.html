<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/">
      <span class="logo">
        @if (site.logo) {
          <img [src]="site.logo" alt="" />
        } @else {
          <span class="logo-placeholder">โลโก้</span>
        }
      </span>
      <span class="brand-text">
        <span class="brand-name">{{ site.systemName }}</span>
        <span class="brand-school">{{ site.schoolName }}</span>
      </span>
    </a>
    <nav class="nav">
      <a routerLink="/">เล่มสารสนเทศ</a>
      <a routerLink="/admin" class="manage">จัดการข้อมูล</a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">© {{ year }} {{ site.schoolName }} · {{ site.systemName }}</div>
</footer>
